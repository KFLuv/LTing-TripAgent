server.port=8078
server.servlet.context-path=/chat

# ==================== 会话配置 ====================
# 会话本身由 config/SessionConfig 持久化到 MySQL 的 tomcat_sessions 表，
# 关掉软件 / 重启后端后仍能恢复登录态。这里只调 cookie 与超时。
#
# cookie 必须带 Max-Age，否则浏览器按"会话 cookie"处理：关掉窗口就丢，
# 重启后带不上 JSESSIONID，服务端就算存了会话也恢复不了。
server.servlet.session.timeout=30d
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.path=/chat
# 桌面端内嵌页面与 iframe 同源，Lax 足够；None 需要 HTTPS，本地用不了
server.servlet.session.cookie.same-site=lax

# ==================== AI 对话配置 ====================
# 留空 ai.api-key 时，/chat/Aichat 会自动退回本地模拟回复（功能不会挂）。
# 填上任意一家 OpenAI 兼容服务的 Key 并重启，就变成真实大模型回答。
#
# 常见免费/低价的 base-url 参考（key 和 model 名以各家控制台为准）：
#   智谱 GLM     https://open.bigmodel.cn/api/paas/v4        模型示例 glm-4.7-flash（免费）
#   讯飞星火     https://spark-api-open.xf-yun.com/v1        模型示例 lite / 4.0Ultra
#   硅基流动     https://api.siliconflow.cn/v1               模型示例 Qwen/Qwen2.5-7B-Instruct（免费）
#   阿里百炼     https://dashscope.aliyuncs.com/compatible-mode/v1
#   DeepSeek     https://api.deepseek.com
#
# 注意：api-key 属于私密信息，不要提交到公开仓库。
ai.base-url=https://api.deepseek.com
ai.api-key=
ai.model=deepseek-chat

# ==================== 定位反查配置 ====================
# GPS 位置引擎会把上报的经纬度反查成地名，供现场指引锚定位置。
# 两个来源，按 geo.amap-key 自动选择，先国内后国外：
#   填了 geo.amap-key → 高德逆地理编码（国内直连、秒级、精确到街道，推荐）；
#   留空             → OpenStreetMap 的 Nominatim（无需 Key，但在境外、需代理且时好时坏）。
# 注意：反查失败时地名会是空的，此时管家只会如实说"拿到坐标但没解析出地名"，
# 绝不会猜一个区/商圈（此前出现过坐标在黄埔、却被告知在天河的误导）。
geo.amap-key=

# Nominatim 在境外，国内直连不通时可用这里显式指定代理，例如 127.0.0.1:7890；
# 留空则自动使用系统代理。高德走直连，不受此项影响。
geo.proxy=

# ==================== 联网检索配置 ====================
# 本地景点库（spot / spot_guide）查不到时，管家会用联网检索补充"好吃好玩好逛"等实时信息。
# 检索源按 search.api-key 自动选择：
#   填了 Key → 博查 AI 搜索（api.bochaai.com，国内直连、中文结果质量好）；
#   留空     → 退回必应中国网页抓取兜底（无需 Key，但结果偏泛化）。
# search.proxy 一般留空走直连；只有本机必须经代理才能上网时才填，形如 127.0.0.1:7890。
# 无论哪种情况，检索不通都只会返回"暂时查不到"，不会编造，也不影响其它功能。
search.api-key=
search.proxy=

# ==================== 页面内嵌地图配置（高德 JS API） ====================
# 点「导航」时不再跳到高德页面，而是在聊天页内嵌一张可拖动、可缩放的地图：
# 红点 = 你的位置，蓝点 = 目的地，并画出驾车路线。
#
# 需要到 https://lbs.amap.com 控制台「添加 Key」，服务平台选「Web端(JS API)」
# （注意：与上面 geo.amap-key 的「Web服务」不是同一个类型，必须单独申请），
# 创建后同时给出 Key 和「安全密钥(jscode)」，两个都要填在这里，例如：
#   map.js-key=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#   map.js-security-code=yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
# 域名白名单留空即可（本地演示）；留空这两项时，聊天页会提示"地图未配置"并给出跳转入口，其它功能不受影响。
map.js-key=
map.js-security-code=

# ==================== 数据库连接（可选） ====================
# 连接参数由 util/MySQLUtil 与 config/SessionConfig 读取，
# 顺序：环境变量 → JVM 系统属性 → 本文件（application.properties）→ 代码内默认值。
# 取消下面 db.* 几行的注释即可直接生效，也仍可被环境变量 / JVM 参数覆盖。
#
#   db.url=jdbc:mysql://localhost:3306/user-mannager?useSSL=false&allowPublicKeyRetrieval=true
#   db.username=root
#   db.password=
#
# 默认口令为空，本地 MySQL 通常需要显式提供：
#   DB_PASSWORD=你的密码 java -jar chat-gpt.jar
