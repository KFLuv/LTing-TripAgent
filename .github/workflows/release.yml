name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.1.2'
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for secrets
        shell: pwsh
        run: ./scripts/check-secrets.ps1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify release versions
        shell: pwsh
        run: |
          $tagVersion = $env:TAG.TrimStart('v')
          $desktopVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          [xml]$pom = Get-Content backend/pom.xml -Raw
          $pomVersion = $pom.project.version
          if ($tagVersion -ne $desktopVersion -or $tagVersion -ne $pomVersion) {
            throw "Version mismatch: tag=$tagVersion desktop=$desktopVersion pom=$pomVersion"
          }

      - name: Build backend jar
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build portable release
        working-directory: desktop
        run: |
          npm run jre
          npx electron-builder --win portable --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: release_notes_${{ env.TAG }}.md
          name: LTing ${{ env.TAG }}
          files: |
            desktop/release_app/*.exe
            backend/target/chat-gpt.jar
